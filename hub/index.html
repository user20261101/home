<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゲームを選ぶ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0e1220;--panel:#171d31;--panel2:#1e2640;--ink:#e8ebf5;--mute:#98a1bd;--rule:#2b3556;--accent:#7fd3ff;--pink:#ff9ecb;--ok:#7be0a8;--err:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.05em;white-space:nowrap}
.sp{flex:1}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--panel2);color:var(--ink);border-radius:8px;padding:6px 12px}
button.pri,a.pri{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:700}
button:disabled{opacity:.4;cursor:default}
header button{padding:3px 8px;font-size:12px}
main{max-width:920px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:0 0 10px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.mute{color:var(--mute)}
label{display:block;margin:10px 0 2px;font-size:13px;color:var(--mute)}
input{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{min-height:1.4em;margin:8px 0 0;font-size:13px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.game{background:var(--panel);border:1px solid var(--rule);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.game.soon{opacity:.75;border-style:dashed}
.cover{position:relative;aspect-ratio:16/9;background:#101733 center/cover no-repeat}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(14,18,32,.92))}
.cover .tt{position:absolute;left:14px;bottom:10px;z-index:2;font-size:22px;font-weight:700;letter-spacing:.06em;text-shadow:0 2px 8px #000}
.cover .ch{position:absolute;right:14px;bottom:14px;width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 6%;border:2px solid var(--accent);background:#d9dbe3;z-index:2}
.cover .badge{position:absolute;left:12px;top:10px;z-index:2;font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:0 9px;background:rgba(14,18,32,.7)}
.body{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body p{margin:0}
.stat{font-size:13px;border:1px solid var(--rule);border-radius:10px;padding:6px 10px;background:var(--panel2)}
.stat b{color:var(--accent)}
.go{margin-top:auto;display:block;text-align:center;text-decoration:none;border-radius:10px;padding:9px 12px;border:1px solid var(--rule);background:var(--panel2);color:var(--ink)}
.go.pri{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:700}
.go.off{opacity:.5;pointer-events:none}
.tag{font-size:11px;background:var(--panel2);border:1px solid var(--rule);border-radius:99px;padding:0 8px;color:var(--mute)}
</style>
</head>
<body>
<header><h1 id="ttl"></h1><span class="sp"></span><span id="who" class="mute" style="font-size:13px"></span><button id="logout" hidden>ログアウト</button></header>
<main id="main"><p class="mute">読み込み中…</p></main>
<script>
const PLATFORM_NAME='更新ゲーム広場（仮）';
const SB_URL='https://zapdekswignvawvmqojd.supabase.co';
const SB_KEY='sb_publishable_sSaJ9wm9x7Bjw9D4Hg9Xiw_ZrvyKDhw';
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const JA_ERR=m=>/Invalid login/i.test(m)?'メールアドレスまたはパスワードが違います。':/already registered/i.test(m)?'このメールアドレスはすでに登録されています。ログインしてください。':/at least 6/i.test(m)?'パスワードは6文字以上にしてください。':/rate limit/i.test(m)?'操作が多すぎます。しばらく待ってからやり直してください。':m;
let sb,session=null;

/* ===== ゲーム一覧（新しいゲームは、ここに1件足すだけ） =====
   status(): そのゲームの「いま」を1行で返す関数（失敗しても一覧は壊れない） */
const GAMES=[
 {id:'hyakki',title:'百姫大戦',badge:'毎平日12:00更新',
  tag:'フィギュア育成バトル',
  desc:'少女型の戦闘機体「インテレギア」を買って、装備を選んで、戦場へ送り出す。結果は、毎回の戦記として読める。',
  href:'../intelegear/',cover:'../intelegear/img/map_colony.jpg',chara:'../intelegear/img/f_sakura.png',
  async status(uid){
    const [ro,pl]=await Promise.all([
      sb.from('ig_rounds').select('no,title,status,deadline').eq('status','open').order('no',{ascending:false}).limit(1).maybeSingle(),
      sb.from('ig_players').select('name,points').eq('user_id',uid).maybeSingle()]);
    const a=[];
    if(ro.data)a.push(`${esc(ro.data.title)}　締切 <b>${fmt(ro.data.deadline)}</b>`);else a.push('次の回を準備中');
    a.push(pl.data?`オーナー：<b>${esc(pl.data.name)}</b>（${pl.data.points}pt）`:'まだ未登録（開くと、サクラが案内します）');
    return a;}},
 {id:'seikai',title:'星海戦記',badge:'読者参加型',
  tag:'宇宙艦隊戦記',
  desc:'読者が艦隊の方針を決めて、物語を動かす、参加型の宇宙艦隊戦記。',
  href:'../',cover:'../img/hero1.webp',
  async status(uid){
    const r=await sb.from('episodes').select('no,title,status,deadline,seasons(title,status)').order('created_at',{ascending:false}).limit(1).maybeSingle();
    if(!r.data)return ['準備中'];
    const e=r.data,s=e.seasons;
    return s&&s.status==='finished'?[`「${esc(s.title)}」は完結しました。<b>次のシーズンを準備中</b>`,`最終話：第${e.no}話 ${esc(e.title)}`]:[`第${e.no}話 ${esc(e.title)}　${e.status==='open'?`締切 <b>${fmt(e.deadline)}</b>`:''}`];}},
 {id:'next',title:'新しいゲーム',badge:'準備中',tag:'',soon:true,desc:'次の定期更新ゲームを準備しています。'}
];

function gate(mode='login'){
  $('#logout').hidden=true;$('#who').textContent='';
  $('#main').innerHTML=`<div class="card" style="max-width:460px;margin:24px auto"><h2>${mode==='login'?'ログイン':'新規登録'}</h2>
  <p class="mute">ここで一度ログインすれば、すべてのゲームを同じアカウントで遊べます。</p>
  <label>メールアドレス</label><input type="email" id="e" autocomplete="email">
  <label>パスワード（6文字以上）</label><input type="password" id="p" autocomplete="${mode==='login'?'current-password':'new-password'}">
  <p class="msg" id="m"></p>
  <div class="row"><button class="pri" id="go">${mode==='login'?'ログイン':'登録する'}</button><button id="sw">${mode==='login'?'はじめての方はこちら':'ログインへ'}</button></div></div>`;
  $('#sw').onclick=()=>gate(mode==='login'?'signup':'login');
  $('#go').onclick=async()=>{
    const email=$('#e').value.trim(),password=$('#p').value,m=$('#m');
    if(!email||!password){m.className='msg err';m.textContent='入力してください。';return;}
    $('#go').disabled=true;
    const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
    $('#go').disabled=false;
    if(r.error){m.className='msg err';m.textContent=JA_ERR(r.error.message);return;}
    if(!r.data.session){m.className='msg ok';m.textContent='確認メールを送りました。リンクを開いてからログインしてください。';return;}
    session=r.data.session;show();
  };
}
async function show(){
  $('#logout').hidden=false;$('#who').textContent=session.user.email||'';
  $('#main').innerHTML=`<h2>ゲームを選ぶ</h2><div class="games">${GAMES.map(g=>card(g)).join('')}</div>
   <p class="mute" style="margin-top:18px;font-size:13px">どのゲームも、同じアカウントで遊べます。ゲームごとに、更新の時刻や遊び方が違います。</p>`;
  for(const g of GAMES){if(!g.status)continue;
    g.status(session.user.id).then(a=>{const el=document.querySelector(`[data-st="${g.id}"]`);if(el)el.innerHTML=a.map(x=>`<div class="stat">${x}</div>`).join('');}).catch(()=>{});}
}
function card(g){
  const cover=g.cover?`style="background-image:url('${g.cover}')"`:'';
  return `<div class="game ${g.soon?'soon':''}"><div class="cover" ${cover}>${g.badge?`<span class="badge">${esc(g.badge)}</span>`:''}${g.chara?`<img class="ch" src="${g.chara}" alt="">`:''}<span class="tt">${esc(g.title)}</span></div>
   <div class="body">${g.tag?`<span class="tag" style="align-self:flex-start">${esc(g.tag)}</span>`:''}<p>${esc(g.desc)}</p>
   <div data-st="${g.id}" style="display:flex;flex-direction:column;gap:6px">${g.status?'<div class="stat mute">読み込み中…</div>':''}</div>
   ${g.soon?'<span class="go off">近日公開</span>':`<a class="go pri" href="${g.href}">このゲームで遊ぶ</a>`}</div></div>`;
}
async function boot(){
  document.title=PLATFORM_NAME;$('#ttl').textContent=PLATFORM_NAME;
  if(!window.supabase){$('#main').innerHTML='<p class="msg err">部品を読み込めませんでした。再読み込みしてください。</p>';return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  ({data:{session}}=await sb.auth.getSession());
  $('#logout').onclick=async()=>{await sb.auth.signOut();location.reload();};
  session?show():gate();
}
boot();
</script>
</body>
</html>
