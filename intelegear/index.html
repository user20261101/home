<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百姫大戦（テスト版）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0e1220;--panel:#171d31;--panel2:#1e2640;--ink:#e8ebf5;--mute:#98a1bd;--rule:#2b3556;--accent:#7fd3ff;--pink:#ff9ecb;--ok:#7be0a8;--err:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.05em}
header h1 small{color:var(--pink);font-size:11px;margin-left:6px}
.sp{flex:1}
header h1{white-space:nowrap}
header h1 small{display:block;margin:0;line-height:1}
header button{padding:3px 8px;font-size:12px;white-space:nowrap}
#who{font-size:13px;text-align:right}
.pt{font-weight:700;color:var(--accent);white-space:nowrap}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--panel2);color:var(--ink);border-radius:8px;padding:6px 12px}
button.pri{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:700}
button:disabled{opacity:.4;cursor:default}
button.sm{padding:3px 9px;font-size:13px}
nav{display:flex;gap:4px;padding:8px 16px 0;overflow-x:auto}
nav button{border-radius:8px 8px 0 0;border-bottom:none;background:transparent;color:var(--mute)}
nav button.on{background:var(--panel);color:var(--ink);border-color:var(--rule)}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.card h2,.card h3{margin:0 0 6px;font-size:16px}
.badge{display:inline-block;font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:0 8px;margin-right:6px;vertical-align:middle}
.mute{color:var(--mute);font-size:13px}
.msg{min-height:1.5em;font-size:14px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
input[type=text],input[type=email],input[type=password],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.item b{font-size:15px}
.st{font-size:12.5px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:4px 6px;border-bottom:1px solid var(--rule);text-align:left}
tr.me td{background:#243257;font-weight:700}
tr.npc td{color:var(--mute)}
.tac label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;margin:6px 0}
.replay{border-left:3px solid var(--pink);padding:2px 12px;margin:10px 0;background:var(--panel2);border-radius:0 8px 8px 0}
.replay p{margin:6px 0;white-space:pre-wrap}
h2.sec{font-size:15px;margin:22px 0 8px;color:var(--accent)}
.grid.figs{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.item.fig{display:flex;gap:12px;align-items:stretch}
.item.fig .bd{flex:1;min-width:0}
.pt-frame{flex:0 0 108px;aspect-ratio:2/3;border:1px dashed var(--rule);border-radius:8px;background:repeating-linear-gradient(135deg,#1a2240 0 8px,#161c34 8px 16px);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);font-size:11px;text-align:center;line-height:1.3}
.pt-frame img{width:100%;height:100%;object-fit:cover;display:block}
.item.it{display:flex;gap:10px;align-items:flex-start}
.item.it .dot{flex:0 0 56px;width:56px;height:56px;image-rendering:pixelated;background:#101733;border:1px solid var(--rule);border-radius:8px;padding:2px}
.item.it .b2{flex:1;min-width:0}
.grid.figs.big{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
.item.fig.big .pt-frame{flex:0 0 220px;cursor:zoom-in}
.item.fig.big{gap:16px}
@media(max-width:560px){.grid.figs.big{grid-template-columns:1fr}.item.fig.big{flex-direction:column}.item.fig.big .pt-frame{flex:none;width:100%;max-width:280px;margin:0 auto}}
#lb{position:fixed;inset:0;background:rgba(5,8,18,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lb img{max-width:94vw;max-height:92vh;border-radius:10px}
.hero{border-color:var(--accent)}
.crown{font-size:18px;font-weight:700;margin:6px 0}
.crown small{font-size:13px;font-weight:400;color:var(--mute)}
.scene{margin:10px 0;position:relative;aspect-ratio:16/9;border:1px dashed var(--rule);border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#1a2240 0 10px,#161c34 10px 20px);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(5,8,18,.85));color:#fff;font-size:13px;line-height:1.4}
.story h4{font-size:17px;margin:14px 0 6px}
.story p{margin:8px 0;line-height:1.85;font-size:15px}
.story p.fin{border-top:1px solid var(--rule);padding-top:10px;font-weight:700}
.mapbox{position:relative;margin:4px 0 8px;line-height:0}
.mapbox img{width:100%;border:1px solid var(--rule);border-radius:8px;display:block}
.rtsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(10,14,28,.78);color:#fff;font-weight:700;font-size:14px;line-height:26px;text-align:center}
.mk.on{background:#ffd166;color:#241a00;border-color:#fff}
.mk i{position:absolute;right:-6px;top:-10px;background:var(--accent);color:#06121f;border-radius:99px;font-style:normal;font-size:11px;line-height:1.2;padding:0 5px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px;margin:6px 0}
.lr{display:flex;gap:8px;font-size:13px;line-height:1.5;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:6px 8px}
.lr.ck{cursor:pointer}.lr.ck:hover{border-color:var(--accent)}
.lr>b{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);text-align:center;line-height:19px;font-size:12px}
</style>
</head>
<body>
<header><h1>百姫大戦<small>テスト版</small></h1><span class="sp"></span><span id="who"></span><button id="logout" hidden>ログアウト</button></header>
<nav id="nav" hidden></nav>
<main id="main"><p class="mute">読み込み中…</p></main>
<script src="itemart.js"></script>
<script>
const SB_URL='https://zapdekswignvawvmqojd.supabase.co';
const SB_KEY='sb_publishable_sSaJ9wm9x7Bjw9D4Hg9Xiw_ZrvyKDhw';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STN={shoot:'射撃',mobility:'機動',melee:'格闘',guard:'防御'};
const KIND={figure:'インテレギア',weapon:'武装',armor:'防具・部品',chip:'強化チップ'};
const RULE={royale:'バトルロイヤル',team:'紅白戦',survival:'耐久試験'};
const TAC={attack:['攻め','結果の振れ幅が大きい。うまくいけば大勝ち、外せば大負け。'],steady:['堅実','振れ幅が小さい。順位が安定する。'],ambush:['待ち伏せ','中くらいの振れ幅。戦場によって相性が変わる。']};
let sb,session,P=null,CAT={},ITEMS=[],ROUNDS=[],FIELDS=[],ENT=null,COUNTS={},RES=[],RANK=[],tab='field',pick=null,flash='';
const JA_ERR=m=>/Invalid login/i.test(m)?'メールアドレスかパスワードが違います。':/already registered/i.test(m)?'このメールアドレスは登録済みです。ログインしてください。':/Password should/i.test(m)?'パスワードは6文字以上にしてください。':m;
const fmt=t=>new Date(t).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});

async function boot(){
  if(!window.supabase){$('#main').innerHTML='<p class="msg err">部品を読み込めませんでした。再読み込みしてください。</p>';return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  ({data:{session}}=await sb.auth.getSession());
  $('#logout').onclick=async()=>{await sb.auth.signOut();session=null;P=null;location.reload();};
  session?await load():gate();
}
function gate(mode='login'){
  $('#nav').hidden=true;$('#logout').hidden=true;
  $('#main').innerHTML=`<div class="card"><h2>${mode==='login'?'ログイン':'新規登録'}</h2>
  <p class="mute">星海戦記のアカウントとは別に登録してください（同じメールアドレスでも構いません）。</p>
  <label>メールアドレス</label><input type="email" id="e" autocomplete="email">
  <label>パスワード（6文字以上）</label><input type="password" id="p" autocomplete="${mode==='login'?'current-password':'new-password'}">
  <p class="msg" id="m"></p>
  <div class="row"><button class="pri" id="go">${mode==='login'?'ログイン':'登録する'}</button><button id="sw">${mode==='login'?'はじめての方はこちら':'ログインへ'}</button></div></div>`;
  $('#sw').onclick=()=>gate(mode==='login'?'signup':'login');
  $('#go').onclick=async()=>{
    const email=$('#e').value.trim(),password=$('#p').value,m=$('#m');
    if(!email||!password){m.className='msg err';m.textContent='入力してください。';return;}
    $('#go').disabled=true;
    const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
    $('#go').disabled=false;
    if(r.error){m.className='msg err';m.textContent=JA_ERR(r.error.message);return;}
    if(!r.data.session){m.className='msg ok';m.textContent='確認メールを送りました。リンクを開いてからログインしてください。';return;}
    session=r.data.session;await load();
  };
}
async function load(){
  $('#logout').hidden=false;
  const uid=session.user.id;
  const [cat,pl]=await Promise.all([sb.from('ig_catalog').select('*').order('sort'),sb.from('ig_players').select('*').eq('user_id',uid).maybeSingle()]);
  if(cat.error){$('#main').innerHTML='<p class="msg err">読み込みに失敗しました。'+esc(cat.error.message)+'</p>';return;}
  CAT=Object.fromEntries(cat.data.map(c=>[c.code,c]));
  P=pl.data;
  if(!P){return register();}
  const [it,ro,en,rk,eq,sy,so]=await Promise.all([
    sb.from('ig_items').select('*').order('id'),
    sb.from('ig_rounds').select('*').order('no',{ascending:false}).limit(3),
    sb.from('ig_entries').select('*'),
    sb.from('ig_players').select('name,earned').order('earned',{ascending:false}).limit(10),
    sb.from('ig_equip').select('*'),
    sb.from('ig_sync').select('*'),
    sb.rpc('ig_soldout')]);
  SOLD=so.data||[];
  SYNC={};(sy.data||[]).forEach(x=>SYNC[x.figure_id]=x.value);
  ITEMS=it.data||[];ROUNDS=ro.data||[];ENT=en.data||[];RANK=rk.data||[];EQ=eq.data||[];
  const ids=ROUNDS.map(r=>r.id);
  const fl=ids.length?await sb.from('ig_fields').select('*').in('round_id',ids).order('id'):{data:[]};
  FIELDS=fl.data||[];
  const open=ROUNDS.find(r=>r.status==='open');
  COUNTS={};
  if(open){const c=await sb.rpc('ig_field_counts',{p_round:open.id});(c.data||[]).forEach(x=>COUNTS[x.field_id]=Number(x.n));}
  const done=ROUNDS.find(r=>r.status==='judged');
  RES=[];
  if(done){const fi=FIELDS.filter(f=>f.round_id===done.id).map(f=>f.id);
    const rs=await sb.from('ig_results').select('*').in('field_id',fi).order('rank');RES=rs.data||[];
    const un=[...new Set(RES.filter(x=>x.user_id).map(x=>x.user_id))];
    if(un.length){const nm=await sb.from('ig_players').select('user_id,name').in('user_id',un);const mp=Object.fromEntries((nm.data||[]).map(p=>[p.user_id,p.name]));RES.forEach(x=>{if(x.user_id)x.name=mp[x.user_id]||'?';});}
  }
  draw();
}
function register(){
  $('#nav').hidden=true;
  $('#main').innerHTML=`<div class="card"><h2>オーナー登録</h2>
  <p>ようこそ。ここは、機械の知性を持つ少女「インテレギア」を育てて戦場へ送り出す、テスト運用中のゲームです。まず、あなたのオーナー名を決めてください（12文字まで）。</p>
  <p class="mute">登録すると、支度金として800ポイントが入ります。カタログでインテレギアと武装を買ってください。</p>
  <label>オーナー名</label><input type="text" id="n" maxlength="12"><p class="msg" id="m"></p>
  <button class="pri" id="go">登録する</button></div>`;
  $('#go').onclick=async()=>{const r=await sb.rpc('ig_join',{p_name:$('#n').value});
    if(r.error){$('#m').className='msg err';$('#m').textContent=r.error.message;return;}
    tab='cat';await load();};
}
function head(){$('#who').innerHTML=`${esc(P.name)}　<span class="pt">${P.points} pt</span>`;
  const T=[['field','戦場'],['garage','ガレージ'],['cat','カタログ'],['res','結果']];
  const n=$('#nav');n.hidden=false;n.innerHTML=T.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('');
  n.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;pick=null;editFig=null;flash='';draw();});}
function draw(){head();({field:vField,garage:vGarage,cat:vCat,res:vRes})[tab]();window.scrollTo(0,0);}
const refundOf=i=>{const j=ROUNDS.find(r=>r.status==='judged'),c=CAT[i.code];const full=!j||new Date(i.created_at)>new Date(j.published_at);return {full,pt:full?c.price:Math.floor(c.price/2)};};
const lv=(base,l,k=0.08)=>Math.round(base*(1+k*l)*10)/10;
const PIC={f_arte:'img/f_arte.png'};
let route=[],SINGLE=false,EQ=[],editFig=null,SYNC={},SOLD=[];
const syncBar=i=>{const v=SYNC[i.id]||0;return `<div class="st" title="体の性能は変わらず、ソフトウェアが成長して得点と安定感が上がります">シンクロ率　<b>${v}%</b></div><div style="height:5px;background:var(--line,#334);border-radius:3px;margin:2px 0 4px"><div style="height:5px;width:${v}%;background:var(--accent,#4ad);border-radius:3px"></div></div>`;};
const hasMap=f=>!!(f.params&&f.params.map);
function mapInner(f){
  const M=f.params.map,act=pick===f.id,pos=Object.fromEntries(M.locs.map(l=>[l.id,l])),pts=route.map(id=>pos[id]).filter(Boolean);
  const line=pts.length>1?`<svg class="rtsvg" viewBox="0 0 100 66.67" preserveAspectRatio="none"><polyline points="${pts.map(q=>q.x+','+(q.y*0.6667)).join(' ')}" fill="none" stroke="#ffd166" stroke-width="2.5" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/></svg>`:'';
  const mks=M.locs.map(l=>{const ns=route.map((r,i)=>r===l.id?i+1:0).filter(Boolean);return `<button class="mk ${ns.length?'on':''}" style="left:${l.x}%;top:${l.y}%" data-loc="${l.id}" title="${esc(l.name)}">${l.id}${ns.length?`<i>${ns.join('・')}</i>`:''}</button>`}).join('');
  const lg=M.locs.map(l=>`<div class="lr ${act?'ck':''}" data-loc="${l.id}"><b>${l.id}</b><span><b>${esc(l.name)}</b>${l.supply?' <span class="badge">補給</span>':''}${l.env?` <span class="badge" style="border-color:var(--pink);color:var(--pink)">${envTxt({params:{env:l.env}})}</span>`:''}<br><span class="mute">${esc(l.desc)}</span></span></div>`).join('');
  return `<div class="mapbox"><img src="${esc(M.img)}" alt="${esc(f.title)}の地図" onerror="this.remove()">${line}${mks}</div>
  <p class="mute" style="margin:0 0 4px">${act?'マップの記号（または下の一覧）を押して、スタート地点から最大3か所まで経路を選びます。同じ地点を続けて選ぶと「待ち伏せ」になり少し有利です。':'「ここに出撃する」を押すと、スタート地点と経路を選べます。'}</p><div class="lg">${lg}</div>`;}
const mapBlock=f=>`<div id="mapw-${f.id}">${mapInner(f)}</div>`;
function bindMap(f){const w=$('#mapw-'+f.id);if(!w)return;
  w.querySelectorAll('[data-loc]').forEach(el=>el.onclick=()=>{if(pick!==f.id)return;
    if(route.length>=3){const m=$('#sm');if(m){m.className='msg err';m.textContent='経路は3か所までです。';}return;}
    route.push(el.dataset.loc);refreshMap(f);});}
function refreshMap(f){const w=$('#mapw-'+f.id);if(!w)return;w.innerHTML=mapInner(f);bindMap(f);sortieUpd(f);}
function sortieUpd(f){
  const rt=$('#rt');if(rt)rt.innerHTML=hasMap(f)?(route.length?`経路：${route.map(r=>`<b>${r}</b>`).join(' → ')}（${route.length}か所）`:'<span style="color:var(--err)">マップの上でスタート地点を選んでください。</span>'):'';
  const a=$('#apv');if(a){const p=aptPreview(f);a.innerHTML=p?`適性　${p}`:'';}
  const fs=$('#fsum');if(fs){const fg=ITEMS.find(i=>i.id==$('#sf').value);fs.innerHTML=fg?`<div class="st">総合　${effLine(fg)}</div>${loadBar(fg)}<div class="st">${eqSummary(fg)}</div><div class="st" style="margin-top:4px">装備はガレージで変えられます。</div>`:'';}}
const ico=code=>window.ItemArt&&CAT[code]?ItemArt.svg(code,CAT[code].stats,56):'';
const portrait=code=>`<div class="pt-frame">${PIC[code]?`<img src="${PIC[code]}" alt="" loading="lazy" onerror="this.parentNode.textContent='画像準備中'">`:'画像準備中'}</div>`;
const ENVN={land:'陸',water:'水',space:'宇'},GR=['C','B','A','S'];
const aptTxt=a=>Object.entries(a||{}).map(([k,v])=>`${ENVN[k]}+${v}段階`).join(' ');
const PARTN={hand:'手',arm:'腕',head:'頭',body:'胴',leg:'脚',back:'背中',chip:'チップ'};
const SLOTS=[['rh','右手','hand'],['lh','左手','hand'],['ra','右腕','arm'],['la','左腕','arm'],['hd','頭','head'],['bd','胴','body'],['lg','脚','leg'],['bk','背中','back'],['c1','チップ1','chip'],['c2','チップ2','chip']];
const eqOf=fid=>{const m={};EQ.filter(e=>e.figure_id===fid).forEach(e=>m[e.slot]=e.item_id);return m;};
const itemOf=id=>ITEMS.find(i=>i.id===id);
function loadOf(fig){const c=CAT[fig.code].stats;let used=0,cap=(c.cap||30)+2*fig.level;
  Object.values(eqOf(fig.id)).forEach(id=>{const it=itemOf(id);if(!it)return;const s=CAT[it.code].stats;used+=s.weight||0;cap+=s.cap||0;});return {used,cap};}
function effStats(fig){const c=CAT[fig.code].stats,L=fig.level;
  let sh=c.shoot*(1+.08*L),mo=c.mobility*(1+.08*L),me=c.melee*(1+.08*L),gu=c.guard*(1+.08*L);
  Object.values(eqOf(fig.id)).forEach(id=>{const it=itemOf(id);if(!it)return;const s=CAT[it.code].stats;gu+=(s.guard||0)*(1+.06*it.level);mo+=s.mobility||0;sh+=s.shoot||0;me+=s.melee||0;});
  const ld=loadOf(fig);mo*=1-.12*ld.used/Math.max(ld.cap,1);
  return {shoot:sh,mobility:mo,melee:me,guard:gu};}
const r1=x=>Math.round(x*10)/10;
const effLine=fig=>{const e=effStats(fig);return Object.keys(STN).map(k=>`${STN[k]}${r1(e[k])}`).join(' / ');};
const loadBar=fig=>{const l=loadOf(fig),pc=Math.min(100,Math.round(100*l.used/Math.max(l.cap,1)));
  return `<div class="st">積載 <b>${l.used}</b> / ${l.cap}</div><div style="height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin:2px 0 4px"><div style="width:${pc}%;height:100%;background:${pc>=90?'var(--pink)':'var(--accent)'}"></div></div>`;};
const eqSummary=fig=>{const eq=eqOf(fig.id),a=SLOTS.filter(sl=>eq[sl[0]]&&itemOf(eq[sl[0]])).map(sl=>`${sl[1]}：${esc(CAT[itemOf(eq[sl[0]]).code].name)}`);return a.length?a.join('<br>'):'装備なし';};
function stLine(it){const c=CAT[it.code],s=c.stats,l=it.level;
  if(c.kind==='figure')return Object.keys(STN).map(k=>`${STN[k]}${lv(s[k],l)}`).join(' / ')+'<br>適性　'+Object.keys(ENVN).map(k=>`${ENVN[k]}<b>${s.apt[k]}</b>`).join(' ')+`　積載量${(s.cap||30)+2*l}`;
  const tail=`${s.part?`　部位：${PARTN[s.part]}`:''}${s.weight?`　重量${s.weight}`:''}`;
  if(c.kind==='weapon')return `${s.kind==='shoot'?'射撃':'近接'}武装　威力${lv(s.power,l,0.1)}`+tail;
  if(c.kind==='armor'){const b=[];if(s.guard)b.push(`防御${lv(s.guard,l,0.06)}`);if(s.mobility)b.push(`機動${s.mobility>0?'+':''}${s.mobility}`);if(s.shoot)b.push(`射撃+${s.shoot}`);if(s.melee)b.push(`格闘+${s.melee}`);if(s.cap)b.push(`積載量+${s.cap}`);if(s.apt)b.push(`適性：${aptTxt(s.apt)}`);return b.join('　')+tail;}
  return Object.entries(s).filter(([k])=>k!=='part'&&k!=='weight').map(([k,v])=>k==='luck'?'運の偏り+'+Math.round(v*100)+'%':k==='apt'?`適性：${aptTxt(v)}`:`${STN[k]}+${v}`).join(' ')+`　部位：チップ`;}
const envTxt=f=>Object.entries((f.params&&f.params.env)||{land:1}).map(([k,v])=>`${ENVN[k]}${v<1?Math.round(v*100)+'%':''}`).join('・');
function aptPreview(f){
  const fg=ITEMS.find(i=>i.id==$('#sf').value);if(!fg)return '';
  const fs=CAT[fg.code].stats.apt,st={};
  Object.values(eqOf(fg.id)).forEach(id=>{const it=itemOf(id);if(!it)return;const a=CAT[it.code].stats.apt||{};Object.keys(a).forEach(k=>st[k]=(st[k]||0)+a[k]);});
  const grade=env=>Object.keys(env).map(k=>{const x=st[k]||0,g=GR[Math.max(0,Math.min(3,GR.indexOf(fs[k])+x))];return `${ENVN[k]}<b>${g}</b>`+(x?`（装備${x>0?'+':''}${x}）`:'');}).join(' ');
  const base=(f.params&&f.params.env)||{land:1};
  if(hasMap(f)){const pos=Object.fromEntries(f.params.map.locs.map(l=>[l.id,l]));
    return route.map(id=>`${id}：${grade(pos[id]&&pos[id].env?pos[id].env:base)}`).join('　');}
  return `この戦場（${envTxt(f)}）　`+grade(base);}
const iname=it=>(it.nickname?esc(it.nickname)+'（'+esc(CAT[it.code].name)+'）':esc(CAT[it.code].name))+(it.level?` Lv${it.level}`:'');
const msgBox=()=>flash?`<p class="msg ${flash.startsWith('!')?'err':'ok'}">${esc(flash.replace(/^!/,''))}</p>`:'';

function vField(){
  const open=ROUNDS.find(r=>r.status==='open');
  if(!open){$('#main').innerHTML=`<div class="card"><h2>受付中の戦場はありません</h2><p class="mute">次の更新（平日12:00）をお待ちください。「結果」タブで前回の結果を見られます。</p></div>`;return;}
  const fs=FIELDS.filter(f=>f.round_id===open.id),mine=ENT.find(e=>e.round_id===open.id);
  SINGLE=fs.length===1;
  if(SINGLE&&pick!==fs[0].id){pick=fs[0].id;route=(mine&&mine.field_id===pick&&mine.route)?[...mine.route]:[];}
  let h=`<div class="card"><h2>${esc(open.title)}</h2><p class="mute">出撃登録の締切：${fmt(open.deadline)}（次の更新で結果が出ます）。登録は何度でも変更できます。</p>${msgBox()}</div>`;
  if(!ITEMS.some(i=>CAT[i.code].kind==='figure'))h+=`<div class="card"><b>まだインテレギアがいません。</b><p class="mute">「カタログ」タブで購入してください。</p></div>`;
  h+=fs.map(f=>`<div class="card"><h3><span class="badge">${RULE[f.rule]}</span><span class="badge" style="border-color:var(--pink);color:var(--pink)">環境：${envTxt(f)}</span>${esc(f.title)}</h3>${hasMap(f)?mapBlock(f):''}<p>${esc(f.brief)}</p>
    <div class="row"><span class="mute">参加登録 ${COUNTS[f.id]||0}人</span><span class="sp"></span>${mine&&mine.field_id===f.id?'<span class="badge" style="border-color:var(--ok);color:var(--ok)">出撃登録済み</span>':''}${SINGLE?'':`<button class="pri" data-f="${f.id}">${mine&&mine.field_id===f.id?'編成を変更':'ここに出撃する'}</button>`}</div></div>`).join('');
  if(pick){const f=FIELDS.find(x=>x.id===pick);h+=sortie(f,mine&&mine.field_id===f.id?mine:null);}
  $('#main').innerHTML=h;
  document.querySelectorAll('button[data-f]').forEach(b=>b.onclick=()=>{pick=+b.dataset.f;flash='';{const ff=FIELDS.find(x=>x.id===pick);route=(mine&&mine.field_id===pick&&mine.route)?[...mine.route]:[];}vField();document.getElementById('sortie')?.scrollIntoView({behavior:'smooth'});});
  if(pick)bindSortie();
  fs.filter(hasMap).forEach(bindMap);
}
function opt(kind,sel,none){const l=ITEMS.filter(i=>CAT[i.code].kind===kind);
  return (none?'<option value="">なし</option>':'')+l.map(i=>`<option value="${i.id}" ${sel==i.id?'selected':''}>${iname(i).replace(/<[^>]*>/g,'')}</option>`).join('');}
function sortie(f,e){
  return `<div class="card" id="sortie" style="border-color:var(--accent)"><h3>出撃編成：${esc(f.title)}</h3>
  <label>インテレギア</label><select id="sf">${opt('figure',e?.figure_id,false)}</select>
  <div id="fsum" style="margin-top:6px"></div>
  ${hasMap(f)?`<label>出撃経路</label><p id="rt" style="margin:0"></p><div class="row" style="margin-top:6px"><button class="sm" id="rb">ひとつ戻す</button><button class="sm" id="rr">やり直す</button></div>`:''}
  <p class="mute" id="apv" style="margin:10px 0 0"></p>
  <label>作戦</label><div class="tac">${Object.entries(TAC).map(([k,v])=>`<label><input type="radio" name="tc" value="${k}" ${(e?e.tactic:'steady')===k?'checked':''}><span><b>${v[0]}</b>　<span class="mute">${v[1]}</span></span></label>`).join('')}</div>
  <p class="msg" id="sm"></p><div class="row"><button class="pri" id="se">${e?'この編成に変更する':'出撃登録する'}</button>${SINGLE?'':'<button id="sx">閉じる</button>'}</div></div>`;}
function bindSortie(){
  const f=FIELDS.find(x=>x.id===pick);
  $('#sf').onchange=()=>sortieUpd(f);sortieUpd(f);
  if(hasMap(f)){$('#rb').onclick=()=>{route.pop();refreshMap(f);};$('#rr').onclick=()=>{route=[];refreshMap(f);};}
  if($('#sx'))$('#sx').onclick=()=>{pick=null;vField();};
  $('#se').onclick=async()=>{
    if(!$('#sf').value){$('#sm').className='msg err';$('#sm').textContent='インテレギアを選んでください。';return;}
    if(hasMap(f)&&!route.length){$('#sm').className='msg err';$('#sm').textContent='マップの上でスタート地点を選んでください。';return;}
    $('#se').disabled=true;
    const r=await sb.rpc('ig_enter',{p_field:pick,p_fig:+$('#sf').value,p_tactic:document.querySelector('input[name=tc]:checked').value,p_route:hasMap(f)?route:null});
    if(r.error){$('#se').disabled=false;$('#sm').className='msg err';$('#sm').textContent=r.error.message;return;}
    flash='出撃登録しました。次の更新で結果が出ます。';pick=null;await load();};
}
function vGarage(){
  const g=k=>ITEMS.filter(i=>CAT[i.code].kind===k);
  const where=it=>{const e=EQ.find(x=>x.item_id===it.id);if(!e)return '';const fg=itemOf(e.figure_id),sl=SLOTS.find(x=>x[0]===e.slot);return fg?`<div class="st" style="color:var(--ok)">装備中：${esc(fg.nickname||CAT[fg.code].name)}（${sl?sl[1]:''}）</div>`:'';};
  const btns=(i,k)=>{const c=CAT[i.code],cost=Math.ceil(c.price*0.4)*(i.level+1);
    return `<div class="row" style="margin-top:8px">${k==='figure'?`<button class="sm pri" data-ed="${i.id}">${editFig===i.id?'装備編集を閉じる':'装備を変更'}</button>`:''}${k!=='chip'?`<button class="sm" data-up="${i.id}" ${i.level>=5||P.points<cost?'disabled':''}>${i.level>=5?'最大':`強化 ${cost}pt`}</button>`:''}<button class="sm" data-rn="${i.id}">名前</button><button class="sm" data-sl="${i.id}">売却 ${refundOf(i).pt}pt${refundOf(i).full?'（購入価格）':''}</button></div>`;};
  let h=`<div class="card"><h2>ガレージ</h2><p class="mute">インテレギアごとに装備を付け替えます。部位は、右手・左手・右腕・左腕・頭・胴・脚・背中・チップ2枠です。装備の重量の合計が、インテレギアの積載量を超えることはできません。売却は、買った回のうちなら購入価格のまま、次の回からは半額です（強化の費用は戻りません）。シンクロ率は、同じインテレギアで出撃するたびに少しずつ上がり、体の性能は変わらないまま、ソフトウェアが成長して得点と安定感が上がります。</p>${msgBox()}</div>`;
  const figs=g('figure');
  h+=`<h2 class="sec">インテレギア（${figs.length}）</h2>`;
  h+=figs.length?`<div class="grid figs big">${figs.map(i=>`<div class="item fig big">${portrait(i.code)}<div class="bd"><b>${iname(i)}</b><div class="st">基本　${stLine(i)}</div><div class="st" style="margin-top:4px">総合　${effLine(i)}</div>${loadBar(i)}${syncBar(i)}<div class="st">${eqSummary(i)}</div>${btns(i,'figure')}</div></div>`).join('')}</div>`:'<p class="mute">なし（「カタログ」で購入してください）</p>';
  if(editFig&&itemOf(editFig)){const fg=itemOf(editFig),eq=eqOf(fg.id);
    h+=`<div class="card" id="editor" style="border-color:var(--accent);margin-top:12px"><h3>装備編集：${iname(fg)}</h3>${loadBar(fg)}<div class="st">総合　${effLine(fg)}（積載が重いほど機動が下がります）</div><p class="msg" id="em"></p>
    ${SLOTS.map(([sl,lb,part])=>{const cands=ITEMS.filter(i=>CAT[i.code].kind!=='figure'&&CAT[i.code].stats.part===part);
      return `<label>${lb}</label><select data-slot="${sl}"><option value="">なし</option>${cands.map(i=>{const e=EQ.find(x=>x.item_id===i.id),other=e&&e.figure_id!==fg.id;
        return `<option value="${i.id}" ${eq[sl]===i.id?'selected':''}>${iname(i).replace(/<[^>]*>/g,'')}　重量${CAT[i.code].stats.weight||0}${other?'（他の体に装備中）':''}</option>`;}).join('')}</select>`;}).join('')}
    <div class="row" style="margin-top:12px"><button id="edx">閉じる</button></div></div>`;}
  for(const k of ['weapon','armor','chip']){const l=g(k);
    h+=`<h2 class="sec">${KIND[k]}（${l.length}）</h2>`;
    h+=l.length?`<div class="grid">${l.map(i=>`<div class="item it">${ico(i.code)}<div class="b2"><b>${iname(i)}</b><div class="st">${stLine(i)}</div>${where(i)}${btns(i,k)}</div></div>`).join('')}</div>`:'<p class="mute">なし</p>';}
  $('#main').innerHTML=h;
  const act=async(fn,ok)=>{const r=await fn();flash=r.error?'!'+r.error.message:ok(r.data);await load();};
  document.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{editFig=editFig===+b.dataset.ed?null:+b.dataset.ed;flash='';vGarage();if(editFig)document.getElementById('editor')?.scrollIntoView({behavior:'smooth'});});
  const edx=$('#edx');if(edx)edx.onclick=()=>{editFig=null;vGarage();};
  document.querySelectorAll('select[data-slot]').forEach(sel=>sel.onchange=async()=>{
    const r=await sb.rpc('ig_equip_set',{p_fig:editFig,p_slot:sel.dataset.slot,p_item:sel.value?+sel.value:null});
    if(r.error){await load();const em=$('#em');if(em){em.className='msg err';em.textContent=r.error.message;}return;}
    await load();document.getElementById('editor')?.scrollIntoView({block:'nearest'});});
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>act(()=>sb.rpc('ig_upgrade',{p_item:+b.dataset.up}),d=>`強化しました（Lv${d.level}、${d.cost}pt）。`));
  document.querySelectorAll('[data-sl]').forEach(b=>b.onclick=()=>{{const it=ITEMS.find(x=>x.id==b.dataset.sl),rf=refundOf(it);if(confirm(rf.full?`売却しますか？（この回に買ったものなので、購入価格の${rf.pt}ptで戻ります）`:`売却しますか？（購入価格の半額、${rf.pt}ptで戻ります）`))act(()=>sb.rpc('ig_sell',{p_item:+b.dataset.sl}),d=>`売却しました（+${d.refund}pt）。`);}});
  document.querySelectorAll('[data-rn]').forEach(b=>b.onclick=()=>{const n=prompt('新しい名前（12文字まで。空で解除）','');if(n!==null)act(()=>sb.rpc('ig_rename',{p_item:+b.dataset.rn,p_name:n}),()=>'名前を変えました。');});
}
function vCat(){
  let h=`<div class="card"><h2>フィギュアカタログ</h2><p class="mute">ポイントでインテレギアと装備を購入します。インテレギアは世界に1体ずつだけで、誰かが所持している間はソールドアウトです（売却すると再び買えます）。武装・防具・チップは何個でも買えます。</p>${msgBox()}</div>`;
  for(const k of Object.keys(KIND)){h+=`<h2 class="sec">${KIND[k]}</h2><div class="grid ${k==='figure'?'figs':''}">`+Object.values(CAT).filter(c=>c.kind===k).map(c=>
    `<div class="item ${k==='figure'?'fig':'it'}">${k==='figure'?portrait(c.code)+'<div class="bd">':ico(c.code)+'<div class="b2">'}<b>${esc(c.name)}</b><div class="st">${stLine({code:c.code,level:0})}</div><p class="mute" style="margin:4px 0 8px">${esc(c.descr)}</p>
    ${k==='figure'&&SOLD.includes(c.code)?`<button class="sm" disabled>ソールドアウト${ITEMS.some(i=>i.code===c.code)?'（あなたが所持）':''}</button>`:`<button class="sm pri" data-b="${c.code}" ${P.points<c.price?'disabled':''}>${c.price}pt で購入</button>`}</div></div>`).join('')+'</div>';}
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{b.disabled=true;const r=await sb.rpc('ig_buy',{p_code:b.dataset.b});
    flash=r.error?'!'+r.error.message:`${CAT[b.dataset.b].name}を購入しました。ガレージに入りました。`;await load();});
}
function vRes(){
  const done=ROUNDS.find(r=>r.status==='judged');
  let h='';
  if(!done)h=`<div class="card"><h2>まだ結果はありません</h2><p class="mute">最初の更新をお待ちください。</p></div>`;
  else{
    h=`<div class="card"><h2>${esc(done.title)}　戦場の記録</h2><p class="mute">${fmt(done.published_at)} 公開。NPCは運営が用意した参加者です。</p></div>`;
    for(const f of FIELDS.filter(f=>f.round_id===done.id)){
      const rs=RES.filter(x=>x.field_id===f.id),mine=rs.find(x=>x.user_id===P.user_id),rep=f.report||{};
      const w=rs[0],wn=w?(w.name||w.npc_name):'';
      let head='';
      if(f.rule==='royale')head=`優勝　${esc(wn)}　<small>${w?w.score:''}点</small>`;
      else if(f.rule==='team')head=rep.team?`${rep.team.winner==='red'?'紅':'白'}組の勝利　<small>紅 ${rep.team.red} ／ 白 ${rep.team.white}　MVP ${esc(wn)}（${w?w.score:''}点）</small>`:esc(wn);
      else{const sv=rs.filter(x=>/生存/.test(x.outcome||'')).length;head=`生存 ${sv}人 ／ 脱落 ${rs.length-sv}人　<small>最高得点 ${esc(wn)}（${w?w.score:''}点）／ 基準 ${rep.threshold??''}</small>`;}
      h+=`<div class="card hero"><h3><span class="badge">${RULE[f.rule]}</span>${esc(f.title)}</h3>
        <div class="crown">🏆 ${head}</div>`;
      if(mine)h+=`<p style="margin:4px 0"><b>あなた：${mine.rank}位 / ${rs.length}人</b>　${esc(mine.outcome||'')}　<span class="pt">+${mine.points_gained}pt</span>${mine.note?'　<span class="mute">'+esc(mine.note)+'</span>':''}</p>`;
      const sc=rep.scene||{};
      h+=`<figure class="scene" style="margin:10px 0">${sc.img?`<img src="${esc(sc.img)}" alt="" onerror="this.remove()">`:''}${sc.img?'':'場面カット　準備中'}${rep.scene_caption?`<figcaption>${esc(rep.scene_caption)}</figcaption>`:''}</figure>`;
      if((rep.story||[]).length){
        h+=`<div class="story">${rep.headline?`<h4>${esc(rep.headline)}</h4>`:''}${rep.story.map((t,k)=>`<p class="${k===rep.story.length-1?'fin':''}">${esc(t)}</p>`).join('')}</div>`;
      }else if(rep.summary)h+=`<p>${esc(rep.summary)}</p>`;
      const top=rs.slice(0,10);if(mine&&mine.rank>10)top.push(mine);
      h+=`<h4 style="margin:16px 0 6px;font-size:15px">順位表</h4><table><tr><th>順位</th><th>名前</th>${f.rule==='team'?'<th>陣営</th>':''}<th>得点</th><th>結果</th></tr>${top.map(x=>`<tr class="${x.user_id===P.user_id?'me':x.npc_name?'npc':''}"><td>${x.rank}</td><td>${esc(x.name||x.npc_name)}${x.npc_name?' <span class="mute">NPC</span>':''}</td>${f.rule==='team'?`<td>${x.side==='red'?'紅':'白'}</td>`:''}<td>${x.score}</td><td>${esc(x.outcome||'')}</td></tr>`).join('')}</table>`;
      (rep.replays||[]).forEach(r=>h+=`<div class="replay"><b>${esc(r.title||'リプレイ')}</b>${r.who?` <span class="mute">${esc(r.who)}</span>`:''}<p>${esc(r.text)}</p></div>`);
      if((rep.editor_note||[]).length)h+=`<div class="card" style="background:var(--panel2);margin:10px 0 0"><b>編集部ノート</b>${rep.editor_note.map(t=>`<p style="margin:6px 0 0;font-size:14px">${esc(t)}</p>`).join('')}</div>`;
      h+='</div>';}
  }
  h+=`<h2 class="sec">獲得ポイントランキング</h2><div class="card"><p class="mute">購入や強化で使っても減りません（戦場で稼いだ累計）。</p><table>${RANK.map((p,i)=>`<tr class="${p.name===P.name?'me':''}"><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.earned}pt</td></tr>`).join('')}</table></div>`;
  $('#main').innerHTML=h;
}
boot();
</script>
</body>
</html>
