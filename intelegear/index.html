<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百姫大戦（テスト版）</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0e1220;--panel:#171d31;--panel2:#1e2640;--ink:#e8ebf5;--mute:#98a1bd;--rule:#2b3556;--accent:#7fd3ff;--pink:#ff9ecb;--ok:#7be0a8;--err:#ff8a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;margin:0;letter-spacing:.05em}
header h1 small{color:var(--pink);font-size:11px;margin-left:6px}
.sp{flex:1}
header h1{white-space:nowrap}
header h1 small{display:block;margin:0;line-height:1}
header button{padding:3px 8px;font-size:12px;white-space:nowrap}
#who{font-size:13px;text-align:right}
.pt{font-weight:700;color:var(--accent);white-space:nowrap}
button{font:inherit;cursor:pointer;border:1px solid var(--rule);background:var(--panel2);color:var(--ink);border-radius:8px;padding:6px 12px}
button.pri{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:700}
button:disabled{opacity:.4;cursor:default}
button.sm{padding:3px 9px;font-size:13px}
nav{display:flex;gap:4px;padding:8px 16px 0;overflow-x:auto}
nav button{border-radius:8px 8px 0 0;border-bottom:none;background:transparent;color:var(--mute)}
nav button.on{background:var(--panel);color:var(--ink);border-color:var(--rule)}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;margin:0 0 14px}
.card h2,.card h3{margin:0 0 6px;font-size:16px}
.badge{display:inline-block;font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:0 8px;margin-right:6px;vertical-align:middle}
.mute{color:var(--mute);font-size:13px}
.msg{min-height:1.5em;font-size:14px}.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
input[type=text],input[type=email],input[type=password],select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:8px 10px}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.item b{font-size:15px}
.st{font-size:12.5px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:4px 6px;border-bottom:1px solid var(--rule);text-align:left}
tr.me td{background:#243257;font-weight:700}
tr.npc td{color:var(--mute)}
.tac label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:14px;margin:6px 0}
.replay{border-left:3px solid var(--pink);padding:2px 12px;margin:10px 0;background:var(--panel2);border-radius:0 8px 8px 0}
.replay p{margin:6px 0;white-space:pre-wrap}
h2.sec{font-size:15px;margin:22px 0 8px;color:var(--accent)}
.grid.figs{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.item.fig{display:flex;gap:12px;align-items:stretch}
.item.fig .bd{flex:1;min-width:0}
.pt-frame{flex:0 0 108px;aspect-ratio:2/3;border:1px dashed var(--rule);border-radius:8px;background:repeating-linear-gradient(135deg,#1a2240 0 8px,#161c34 8px 16px);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mute);font-size:11px;text-align:center;line-height:1.3}
.pt-frame{position:relative}
.pt-frame svg.figdot{width:100%;height:100%;display:block;image-rendering:pixelated;cursor:zoom-in}
.fc .pt-frame svg.figdot,.fc .pt-frame img{cursor:pointer}
.pt-frame .tmp{position:absolute;right:4px;top:4px;font-size:10px;background:rgba(5,8,18,.75);color:var(--mute);border-radius:99px;padding:0 6px;pointer-events:none}
.pt-frame img{width:100%;height:100%;object-fit:cover;display:block}
.item.it{display:flex;gap:10px;align-items:flex-start}
.item.it .dot{flex:0 0 56px;width:56px;height:56px;image-rendering:pixelated;background:#101733;border:1px solid var(--rule);border-radius:8px;padding:2px}
.item.it .b2{flex:1;min-width:0}
.grid.figs.big{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
.item.fig.big .pt-frame{flex:0 0 220px;cursor:zoom-in}
.item.fig.big{gap:16px}
@media(max-width:560px){.grid.figs.big{grid-template-columns:1fr}.item.fig.big{flex-direction:column}.item.fig.big .pt-frame{flex:none;width:100%;max-width:280px;margin:0 auto}}
#lb{position:fixed;inset:0;background:rgba(5,8,18,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lb img{max-width:94vw;max-height:92vh;border-radius:10px}
.hero{border-color:var(--accent)}
.crown{font-size:18px;font-weight:700;margin:6px 0}
.crown small{font-size:13px;font-weight:400;color:var(--mute)}
.scene{margin:10px 0;position:relative;aspect-ratio:16/9;border:1px dashed var(--rule);border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,#1a2240 0 10px,#161c34 10px 20px);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px}
.scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(5,8,18,.85));color:#fff;font-size:13px;line-height:1.4}
.story h4{font-size:17px;margin:14px 0 6px}
.story p{margin:8px 0;line-height:1.85;font-size:15px}
.story p.fin{border-top:1px solid var(--rule);padding-top:10px;font-weight:700}
.fstrip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.fc{flex:0 0 118px;border:2px solid var(--rule);border-radius:10px;background:var(--panel2);padding:6px;cursor:pointer;text-align:center;position:relative}
.fc.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,170,255,.22)}
.fc .pt-frame{flex:none;width:100%;margin-bottom:4px}
.fc b{font-size:12.5px;display:block;line-height:1.3}
.tag{display:inline-block;font-size:10.5px;border-radius:99px;padding:0 7px;background:var(--accent);color:#06121f;font-weight:700}
.asm-r{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
@media(max-width:760px){.asm-r{position:static;max-height:none}}
.asm{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:12px;align-items:start}
@media(max-width:760px){.asm{grid-template-columns:1fr}}
.unit{display:flex;gap:12px;align-items:flex-start}
.unit .uf{flex:0 0 130px}.unit .uf .pt-frame{flex:none;width:100%}
.unit .us{flex:1;min-width:0}
.sb{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:3px 0}
.sb i{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.sb u{display:block;height:100%;background:var(--accent)}
.sgroup{font-size:12px;color:var(--accent);margin:10px 0 2px}.sgroup:first-child{margin-top:0}
.sl{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--panel2);margin:5px 0;cursor:pointer}
.sl:hover{border-color:var(--accent)}.sl.on{border-color:var(--accent);background:#1c2a52}
.sl .lb{flex:0 0 52px;font-size:12px;color:var(--mute)}
.sl .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl .w{font-size:11px;color:var(--mute)}
.emp{display:inline-block;flex:0 0 32px;width:32px;height:32px;border:1px dashed var(--rule);border-radius:6px}
.pk .row2{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;margin:6px 0;background:var(--panel2);cursor:pointer}
.pk .row2:hover{border-color:var(--accent)}.pk .row2.cur{border-color:var(--ok)}.pk .row2.ng{opacity:.5;cursor:not-allowed}
.pk .row2 .dot{flex:0 0 44px;background:#101733;border:1px solid var(--rule);border-radius:8px;padding:2px}
.dl{display:inline-block;font-size:11px;border-radius:99px;padding:0 7px;margin:2px 3px 0 0;background:#1b2a4a}
.dl.up{color:#6ee7a0}.dl.dn{color:#ff8a9b}
nav button{position:relative;display:flex;align-items:center;gap:5px}
nav .ni{font-size:15px}
nav .nb{position:absolute;top:3px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px var(--bg)}
@media(max-width:700px){
 nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--rule);padding:4px 6px calc(4px + env(safe-area-inset-bottom));gap:2px;overflow:visible}
 nav button{flex:1;flex-direction:column;gap:0;border:none!important;border-radius:10px;padding:5px 2px;background:transparent;font-size:11px;line-height:1.3}
 nav button.on{background:var(--panel2);color:var(--accent)}
 nav .ni{font-size:20px}
 nav .nb{top:2px;right:calc(50% - 20px)}
 main{padding-bottom:92px}
}
.stat{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.stat .pill{flex:1 1 220px;border:1px solid var(--rule);border-radius:10px;padding:8px 12px;background:var(--panel2)}
.stat .pill b{display:block;font-size:12px;color:var(--mute);font-weight:400}
.stat .pill.warn{border-color:var(--pink)}.stat .pill.good{border-color:var(--ok)}
.guide ol{margin:6px 0 0;padding-left:1.3em}.guide li{margin:4px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chips button{border-radius:99px;padding:3px 12px;font-size:13px}
.chips button.on{background:var(--accent);color:#06121f;border-color:var(--accent);font-weight:700}
details.how{margin:0 0 14px}details.how summary{cursor:pointer;color:var(--accent);padding:6px 2px}
details.how p{margin:6px 0}
#tut{position:fixed;inset:0;z-index:60;background:rgba(5,8,18,.92);display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
.tutp{width:100%;max-width:760px;display:flex;gap:18px;align-items:flex-end;background:var(--panel);border:1px solid var(--accent);border-radius:16px;padding:16px;box-shadow:0 0 40px rgba(127,211,255,.15)}
.tutf{flex:0 0 190px;text-align:center}
.tutf img{width:100%;max-height:48vh;object-fit:contain;display:block;border-radius:10px;background:#d9dbe3}
.tutf .who{display:inline-block;margin-top:6px;font-weight:700;color:var(--accent);font-size:14px}
.tutb{flex:1;min-width:0}
.tutb h3{font-size:18px;margin:0 0 8px}
.tutb p{margin:8px 0;line-height:1.85;font-size:15px}
.tutn{font-size:12px;color:var(--mute)}
.dots{display:flex;gap:5px;margin:10px 0 12px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--rule)}.dots i.on{background:var(--accent)}
@media(max-width:600px){.tutp{flex-direction:column;align-items:stretch;padding:12px}.tutf{flex:none;display:flex;gap:10px;align-items:center;text-align:left}.tutf img{width:84px;max-height:none;aspect-ratio:2/3;object-fit:cover}}
.libhero{display:flex;gap:14px;align-items:center}
.libhero img{width:84px;border-radius:10px;aspect-ratio:2/3;object-fit:cover;background:#d9dbe3}
details.lib{background:var(--panel);border:1px solid var(--rule);border-radius:12px;margin:0 0 10px;padding:2px 14px}
details.lib summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--accent)}
details.lib p,details.lib li{line-height:1.8;font-size:14.5px}
details.lib table{margin:6px 0 10px}
.mapbox{position:relative;margin:4px 0 8px;line-height:0}
.mapbox img{width:100%;border:1px solid var(--rule);border-radius:8px;display:block}
.rtsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #fff;background:rgba(10,14,28,.78);color:#fff;font-weight:700;font-size:14px;line-height:26px;text-align:center}
.mk.on{background:#ffd166;color:#241a00;border-color:#fff}
.mk i{position:absolute;right:-6px;top:-10px;background:var(--accent);color:#06121f;border-radius:99px;font-style:normal;font-size:11px;line-height:1.2;padding:0 5px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px;margin:6px 0}
.lr{display:flex;gap:8px;font-size:13px;line-height:1.5;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;padding:6px 8px}
.lr.ck{cursor:pointer}.lr.ck:hover{border-color:var(--accent)}
.lr>b{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);text-align:center;line-height:19px;font-size:12px}
</style>
</head>
<body>
<header><h1>百姫大戦<small>テスト版</small></h1><span class="sp"></span><span id="who"></span><button id="logout" hidden>ログアウト</button></header>
<nav id="nav" hidden></nav>
<main id="main"><p class="mute">読み込み中…</p></main>
<script src="itemart.js"></script>
<script src="figart.js"></script>
<script>
const SB_URL='https://zapdekswignvawvmqojd.supabase.co';
const SB_KEY='sb_publishable_sSaJ9wm9x7Bjw9D4Hg9Xiw_ZrvyKDhw';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STN={shoot:'射撃',mobility:'機動',melee:'格闘',guard:'防御'};
const KIND={figure:'インテレギア',weapon:'武装',armor:'防具・部品',chip:'強化チップ'};
const RULE={royale:'バトルロイヤル',team:'紅白戦',survival:'耐久試験'};
const TAC={attack:['攻め','結果の振れ幅が大きい。うまくいけば大勝ち、外せば大負け。'],steady:['堅実','振れ幅が小さい。順位が安定する。'],ambush:['待ち伏せ','中くらいの振れ幅。戦場によって相性が変わる。']};
let sb,session,P=null,CAT={},ITEMS=[],ROUNDS=[],FIELDS=[],ENT=null,COUNTS={},RES=[],RANK=[],tab='field',pick=null,flash='';
const JA_ERR=m=>/Invalid login/i.test(m)?'メールアドレスかパスワードが違います。':/already registered/i.test(m)?'このメールアドレスは登録済みです。ログインしてください。':/Password should/i.test(m)?'パスワードは6文字以上にしてください。':m;
const fmt=t=>new Date(t).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});

async function boot(){
  if(!window.supabase){$('#main').innerHTML='<p class="msg err">部品を読み込めませんでした。再読み込みしてください。</p>';return;}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  ({data:{session}}=await sb.auth.getSession());
  $('#logout').onclick=async()=>{await sb.auth.signOut();session=null;P=null;location.reload();};
  session?await load():gate();
}
function gate(mode='login'){
  $('#nav').hidden=true;$('#logout').hidden=true;
  $('#main').innerHTML=`<div class="card"><h2>${mode==='login'?'ログイン':'新規登録'}</h2>
  <p class="mute">星海戦記のアカウントとは別に登録してください（同じメールアドレスでも構いません）。</p>
  <label>メールアドレス</label><input type="email" id="e" autocomplete="email">
  <label>パスワード（6文字以上）</label><input type="password" id="p" autocomplete="${mode==='login'?'current-password':'new-password'}">
  <p class="msg" id="m"></p>
  <div class="row"><button class="pri" id="go">${mode==='login'?'ログイン':'登録する'}</button><button id="sw">${mode==='login'?'はじめての方はこちら':'ログインへ'}</button></div></div>`;
  $('#sw').onclick=()=>gate(mode==='login'?'signup':'login');
  $('#go').onclick=async()=>{
    const email=$('#e').value.trim(),password=$('#p').value,m=$('#m');
    if(!email||!password){m.className='msg err';m.textContent='入力してください。';return;}
    $('#go').disabled=true;
    const r=mode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
    $('#go').disabled=false;
    if(r.error){m.className='msg err';m.textContent=JA_ERR(r.error.message);return;}
    if(!r.data.session){m.className='msg ok';m.textContent='確認メールを送りました。リンクを開いてからログインしてください。';return;}
    session=r.data.session;await load();
  };
}
async function load(){
  $('#logout').hidden=false;
  const uid=session.user.id;
  const [cat,pl]=await Promise.all([sb.from('ig_catalog').select('*').order('sort'),sb.from('ig_players').select('*').eq('user_id',uid).maybeSingle()]);
  if(cat.error){$('#main').innerHTML='<p class="msg err">読み込みに失敗しました。'+esc(cat.error.message)+'</p>';return;}
  CAT=Object.fromEntries(cat.data.map(c=>[c.code,c]));
  P=pl.data;
  if(!P){return register();}
  const [it,ro,en,rk,eq,sy,so]=await Promise.all([
    sb.from('ig_items').select('*').order('id'),
    sb.from('ig_rounds').select('*').order('no',{ascending:false}).limit(12),
    sb.from('ig_entries').select('*'),
    sb.from('ig_players').select('name,earned').order('earned',{ascending:false}).limit(10),
    sb.from('ig_equip').select('*'),
    sb.from('ig_sync').select('*'),
    sb.rpc('ig_soldout')]);
  SOLD=Array.isArray(so.data)?so.data:[];
  SYNC={};(sy.data||[]).forEach(x=>SYNC[x.figure_id]=x.value);
  ITEMS=it.data||[];ROUNDS=ro.data||[];ENT=en.data||[];RANK=rk.data||[];EQ=eq.data||[];
  const ids=ROUNDS.map(r=>r.id);
  const fl=ids.length?await sb.from('ig_fields').select('*').in('round_id',ids).order('id'):{data:[]};
  FIELDS=fl.data||[];
  const open=ROUNDS.find(r=>r.status==='open');
  COUNTS={};
  if(open){const c=await sb.rpc('ig_field_counts',{p_round:open.id});(c.data||[]).forEach(x=>COUNTS[x.field_id]=Number(x.n));}
  const doneIds=ROUNDS.filter(r=>r.status==='judged').map(r=>r.id);
  RES=[];
  if(doneIds.length){const fi=FIELDS.filter(f=>doneIds.includes(f.round_id)).map(f=>f.id);
    const rs=await sb.from('ig_results').select('*').in('field_id',fi).order('rank');RES=rs.data||[];
    const un=[...new Set(RES.filter(x=>x.user_id).map(x=>x.user_id))];
    if(un.length){const nm=await sb.from('ig_players').select('user_id,name').in('user_id',un);const mp=Object.fromEntries((nm.data||[]).map(p=>[p.user_id,p.name]));RES.forEach(x=>{if(x.user_id)x.name=mp[x.user_id]||'?';});}
  }
  draw();
}
function register(){
  $('#nav').hidden=true;
  $('#main').innerHTML=`<div class="card"><h2>オーナー登録</h2>
  <p>ようこそ。ここは、機械の知性を持つ少女「インテレギア」を育てて戦場へ送り出す、テスト運用中のゲームです。まず、あなたのオーナー名を決めてください（12文字まで）。</p>
  <p class="mute">登録すると、支度金として800ポイントが入ります。カタログでインテレギアと武装を買ってください。</p>
  <label>オーナー名</label><input type="text" id="n" maxlength="12"><p class="msg" id="m"></p>
  <button class="pri" id="go">登録する</button></div>`;
  $('#go').onclick=async()=>{const r=await sb.rpc('ig_join',{p_name:$('#n').value});
    if(r.error){$('#m').className='msg err';$('#m').textContent=r.error.message;return;}
    tab='field';await load();};
}
function head(){$('#who').innerHTML=`${esc(P.name)}　<span class="pt">${P.points} pt</span>`;
  const T=[['field','⚔️','戦場'],['garage','🔧','ガレージ'],['cat','🛒','カタログ'],['res','📜','結果'],['lib','📚','資料室']];
  const op=ROUNDS.find(r=>r.status==='open'),needs=op&&!ENT.some(e=>e.round_id===op.id);

  $('#caf').onchange=e=>{CAFF=e.target.checked;vCat();};
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=async()=>{b.disabled=true;const y=window.scrollY;const r=await sb.rpc('ig_buy',{p_code:b.dataset.b});
    flash=r.error?'!'+r.error.message:`${CAT[b.dataset.b].name}を購入しました。ガレージに入りました。`;await load();window.scrollTo(0,y);});
}
let RSEL=null;
function vRes(){
  const judged=ROUNDS.filter(r=>r.status==='judged');
  const done=judged.find(r=>r.id===RSEL)||judged[0];
  let h='';
  if(!done)h=`<div class="card"><h2>まだ結果はありません</h2><p class="mute">最初の更新をお待ちください。</p></div>`;
  else{
    h=`<div class="card"><h2>${esc(done.title)}　戦場の記録</h2><p class="mute">${fmt(done.published_at)} 公開。NPCは運営が用意した参加者です。</p>${judged.length>1?`<div class="chips">${judged.map(r=>`<button class="${r.id===done.id?'on':''}" data-rs="${r.id}">${esc(r.title)}</button>`).join('')}</div>`:''}</div>`;
    for(const f of FIELDS.filter(f=>f.round_id===done.id)){
      const rs=RES.filter(x=>x.field_id===f.id),mine=rs.find(x=>x.user_id===P.user_id),rep=f.report||{};
      const w=rs[0],wn=w?(w.name||w.npc_name):'';
      let head='';
      if(f.rule==='royale')head=`優勝　${esc(wn)}　<small>${w?w.score:''}点</small>`;
      else if(f.rule==='team')head=rep.team?`${rep.team.winner==='red'?'紅':'白'}組の勝利　<small>紅 ${rep.team.red} ／ 白 ${rep.team.white}　MVP ${esc(wn)}（${w?w.score:''}点）</small>`:esc(wn);
      else{const sv=rs.filter(x=>/生存/.test(x.outcome||'')).length;head=`生存 ${sv}人 ／ 脱落 ${rs.length-sv}人　<small>最高得点 ${esc(wn)}（${w?w.score:''}点）／ 基準 ${rep.threshold??''}</small>`;}
      h+=`<div class="card hero"><h3><span class="badge">${RULE[f.rule]}</span>${esc(f.title)}</h3>
        <div class="crown">🏆 ${head}</div>`;
      if(mine)h+=`<p style="margin:4px 0"><b>あなた：${mine.rank}位 / ${rs.length}人</b>　${esc(mine.outcome||'')}　<span class="pt">+${mine.points_gained}pt</span>${mine.note?'　<span class="mute">'+esc(mine.note)+'</span>':''}</p>`;
      const sc=rep.scene||{};
      h+=`<figure class="scene" style="margin:10px 0">${sc.img?`<img src="${esc(sc.img)}" alt="" onerror="this.remove()">`:''}${sc.img?'':'場面カット　準備中'}${rep.scene_caption?`<figcaption>${esc(rep.scene_caption)}</figcaption>`:''}</figure>`;
      if((rep.story||[]).length){
        h+=`<div class="story">${rep.headline?`<h4>${esc(rep.headline)}</h4>`:''}${rep.story.map((t,k)=>`<p class="${k===rep.story.length-1?'fin':''}">${esc(t)}</p>`).join('')}</div>`;
      }else if(rep.summary)h+=`<p>${esc(rep.summary)}</p>`;
      const top=rs.slice(0,10);if(mine&&mine.rank>10)top.push(mine);
      h+=`<h4 style="margin:16px 0 6px;font-size:15px">順位表</h4><table><tr><th>順位</th><th>名前</th>${f.rule==='team'?'<th>陣営</th>':''}<th>得点</th><th>結果</th></tr>${top.map(x=>`<tr class="${x.user_id===P.user_id?'me':x.npc_name?'npc':''}"><td>${x.rank}</td><td>${esc(x.name||x.npc_name)}${x.npc_name?' <span class="mute">NPC</span>':''}</td>${f.rule==='team'?`<td>${x.side==='red'?'紅':'白'}</td>`:''}<td>${x.score}</td><td>${esc(x.outcome||'')}</td></tr>`).join('')}</table>`;
      (rep.replays||[]).forEach(r=>h+=`<div class="replay"><b>${esc(r.title||'リプレイ')}</b>${r.who?` <span class="mute">${esc(r.who)}</span>`:''}<p>${esc(r.text)}</p></div>`);
      if((rep.editor_note||[]).length)h+=`<div class="card" style="background:var(--panel2);margin:10px 0 0"><b>編集部ノート</b>${rep.editor_note.map(t=>`<p style="margin:6px 0 0;font-size:14px">${esc(t)}</p>`).join('')}</div>`;
      h+='</div>';}
  }
  h+=`<h2 class="sec">獲得ポイントランキング</h2><div class="card"><p class="mute">購入や強化で使っても減りません（戦場で稼いだ累計）。</p><table>${RANK.map((p,i)=>`<tr class="${p.name===P.name?'me':''}"><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.earned}pt</td></tr>`).join('')}</table></div>`;
  $('#main').innerHTML=h;
  document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{RSEL=+b.dataset.rs;vRes();window.scrollTo(0,0);});
}
document.addEventListener('click',e=>{const im=e.target.closest('.pt-frame img,.pt-frame svg');if(!im||im.closest('.fc,#tut'))return;
  const o=document.createElement('div');o.id='lb';
  o.innerHTML=im.tagName==='IMG'?`<img src="${im.src}" alt="">`:im.outerHTML.replace('<svg','<svg style="height:90vh;width:auto;max-width:94vw;background:#1a2240;border-radius:10px"');
  o.onclick=()=>o.remove();document.body.appendChild(o);});
boot();
</script>
</body>
